name: clock drift

# bte's clocks, the system clock and the steady clock against every NTP server address, per runner (bte/clock_drift.cpp)
on:
  push:
    paths:
      - bte/clock_drift.cpp
      - .github/workflows/clock.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to measure
        default: '3600'
      more:
        description: Runs to start after this one, one after another
        default: '0'

jobs:
  drift:
    name: ${{ matrix.name }} ${{ matrix.copy }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        # Three of each at once: each lands on whatever machine is free, so a run measures more machines
        copy: [1, 2, 3]
        name: [linux-x64, linux-arm64, macos-arm64, windows-x64, windows-x86, windows-arm64]
        include:
          - name: linux-x64
            os: ubuntu-24.04
            configure: -DCMAKE_CXX_COMPILER=g++-14
          - name: linux-arm64
            os: ubuntu-24.04-arm
            configure: -DCMAKE_CXX_COMPILER=g++-14
          - name: macos-arm64
            os: macos-15
          - name: windows-x64
            os: windows-2025
            configure: -A x64
          - name: windows-x86
            os: windows-2025
            configure: -A Win32
          - name: windows-arm64
            os: windows-11-arm
            configure: -A ARM64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S bte -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --target clock_drift --parallel
      - name: Machine
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          case "$RUNNER_OS" in
            Linux) grep -m1 'model name' /proc/cpuinfo || true; timedatectl timesync-status 2>/dev/null | head -12 || true
                   cat /sys/devices/system/clocksource/clocksource0/current_clocksource || true ;;
            macOS) sysctl -n machdep.cpu.brand_string || true ;;
            Windows) powershell -Command "(Get-CimInstance Win32_Processor).Name; w32tm /query /status" || true ;;
          esac | tee -a machine.txt
          { echo '```'; cat machine.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Measure
        run: |
          set -o pipefail
          exe=build/clock_drift
          [ -x "$exe" ] || exe=build/Release/clock_drift.exe
          "$exe" "${{ github.event.inputs.seconds || '3600' }}" | tee drift.txt
          { echo '<details><summary>every round, every address (drift.csv)</summary>'; echo; echo '```'; cat drift.csv
            echo '```'; echo '</details>'; } >> "$GITHUB_STEP_SUMMARY"
          # The machine, the report and the rounds as annotations too, which the API serves without signing in
          annotate() { sed 's/%/%25/g' | head -c 16000 | awk '{printf "%s%%0A", $0}'; }
          report=$({ cat machine.txt; grep -v '^round ' drift.txt; } | annotate)
          echo "::notice title=clock drift ${{ matrix.name }} ${{ matrix.copy }}::$report"
          # An annotation keeps its first 4 KB, so the rounds go in parts of whole lines
          grep '^round ' drift.txt | awk 'BEGIN { part = 0 } { if (size + length($0) > 3800) { part++; size = 0 }
            size += length($0) + 1; print > ("rounds-" part ".txt") }'
          for f in rounds-*.txt; do
            echo "::notice title=rounds ${{ matrix.name }} ${{ matrix.copy }} ${f//[^0-9]/}::$(annotate < "$f")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.name }}-${{ matrix.copy }}
          path: drift.csv

  # A push starts 5 more runs, one after another, for more machines; a dispatch as many as its input says
  next:
    needs: drift
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          MORE: ${{ github.event_name == 'push' && '5' || github.event.inputs.more || '0' }}
          SECONDS_TO_MEASURE: ${{ github.event.inputs.seconds || '3600' }}
        run: |
          if [ "$MORE" -gt 0 ]; then
            gh workflow run clock.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
              -f more=$((MORE - 1)) -f seconds="$SECONDS_TO_MEASURE"
          fi
