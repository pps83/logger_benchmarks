name: bte logger

# backtest-engine's logger (bte/, copied by tools/sync_bte.py): its tests and log_stress on every platform it targets
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            os: ubuntu-24.04
            cxx: g++-14
          - name: linux-x64-clang
            os: ubuntu-24.04
            cxx: clang++-18
          - name: linux-arm64-gcc
            os: ubuntu-24.04-arm
            cxx: g++-14
          - name: macos-arm64-clang
            os: macos-15
            cxx: clang++
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S bte -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee out.log
      - name: Logger tests
        run: |
          set -o pipefail
          ./build/bte_log_tests --gtest_brief=1 2>&1 | tee -a out.log
      - name: log_stress
        run: |
          set -o pipefail
          ./build/log_stress --runs 3 2>&1 | tee -a out.log
      # Annotations can be read without signing in, unlike the log
      - name: Report
        if: failure()
        run: grep -E "error|warning|FAILED|Failure|failed|rerun" out.log | head -40 | sed 's/^/::error::/'

  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-2025
            platform: x64
          - name: windows-x86-msvc
            os: windows-2025
            platform: Win32
          - name: windows-arm64-msvc
            os: windows-11-arm
            platform: ARM64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S bte -B build -A ${{ matrix.platform }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee out.log
      - name: Logger tests
        run: |
          set -o pipefail
          ./build/Release/bte_log_tests.exe --gtest_brief=1 2>&1 | tee -a out.log
      - name: log_stress
        run: |
          set -o pipefail
          ./build/Release/log_stress.exe --runs 3 2>&1 | tee -a out.log
      # Annotations can be read without signing in, unlike the log
      - name: Report
        if: failure()
        run: grep -E "error|warning|FAILED|Failure|failed|rerun" out.log | head -40 | sed 's/^/::error::/'
