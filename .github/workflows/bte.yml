name: bte logger

# backtest-engine's logger (bte/, copied by tools/sync_bte.py): its tests and log_stress on every platform it targets
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  posix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            os: ubuntu-24.04
            cxx: g++-14
          - name: linux-x64-clang
            os: ubuntu-24.04
            cxx: clang++-18
          - name: linux-arm64-gcc
            os: ubuntu-24.04-arm
            cxx: g++-14
          - name: macos-arm64-clang
            os: macos-15
            cxx: clang++
          - name: linux-x64-asan
            os: ubuntu-24.04
            cxx: clang++-18
            flags: -fsanitize=address -fno-omit-frame-pointer -g
          - name: linux-x64-tsan
            os: ubuntu-24.04
            cxx: clang++-18
            flags: -fsanitize=thread -g
          - name: linux-x64-ubsan
            os: ubuntu-24.04
            cxx: clang++-18
            flags: -fsanitize=undefined -fno-sanitize-recover=undefined -g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # The runners' high-entropy ASLR breaks the sanitizers' shadow memory
      - name: Sanitizer address space
        if: matrix.flags
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: |
          cmake -S bte -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee out.log
      - name: Logger tests
        run: |
          set -o pipefail
          ./build/bte_log_tests --gtest_brief=1 2>&1 | tee -a out.log
      - name: log_stress
        run: |
          set -o pipefail
          ./build/log_stress --runs 3 2>&1 | tee -a out.log
      # Annotations can be read without signing in, unlike the log
      - name: Report
        if: failure()
        run: |
          # A step keeps its first ten annotations, so a block of lines goes into one
          block() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | sed "s/^/::error title=$1::/"; echo; }
          grep -A30 "Checking that LOG call sites" out.log | grep -v " warning: " | block call-site-check || true
          obj=$(find build -name "LogCallSites.cpp.o" | head -1)
          if [ -n "$obj" ]; then
            objdump -d -r --no-show-raw-insn "$obj" | head -400 | block call-site-disassembly || true
          fi
          grep -E "error|ERROR|WARNING|SUMMARY|FAILED|Failure|failed|rerun|call site|logCallSite" out.log |
            grep -v " warning: " | head -40 | sed 's/^/::error::/'

  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-msvc
            os: windows-2025
            platform: x64
          - name: windows-x86-msvc
            os: windows-2025
            platform: Win32
          - name: windows-arm64-msvc
            os: windows-11-arm
            platform: ARM64
          - name: windows-x64-clangcl
            os: windows-2025
            platform: x64
            toolset: -T ClangCL
          - name: windows-x86-clangcl
            os: windows-2025
            platform: Win32
            toolset: -T ClangCL
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S bte -B build -A ${{ matrix.platform }} ${{ matrix.toolset }}
      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 2>&1 | tee out.log
      - name: Logger tests
        run: |
          set -o pipefail
          ./build/Release/bte_log_tests.exe --gtest_brief=1 2>&1 | tee -a out.log
      - name: log_stress
        run: |
          set -o pipefail
          ./build/Release/log_stress.exe --runs 3 2>&1 | tee -a out.log
      # Annotations can be read without signing in, unlike the log
      - name: Report
        if: failure()
        run: |
          grep -E "error|FAILED|Failure|failed|rerun|call site|logCallSite" out.log |
            grep -v " warning " | head -40 | sed 's/^/::error::/'
